<!DOCTYPE html>
<html>
<head>
<title>Track Orders</title>
</head>
<body>

<h2>Your Orders</h2>
<div id="orders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
});

const db=getFirestore(app);

let url=new URLSearchParams(window.location.search);
let phone=url.get("phone");

async function load(){
 let snap=await getDocs(collection(db,"orders"));
 let html="";

 snap.forEach(d=>{
 let o=d.data();
 if(o.phone==phone){
 html+=`<div>
 <b>ID:</b>${d.id}<br>
 <b>Total:</b>${o.total}<br>
 <b>Status:</b>${o.status}<hr>
 </div>`;
 }
 });

 document.getElementById("orders").innerHTML=html||"No orders";
}

load();
</script>

</body>
</html>
