<!DOCTYPE html>
<html>
<body>
<h2>My Orders</h2>
<div id="data"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const app = initializeApp({projectId:"azad-prime-medico"});
const db = getFirestore(app);

let phone=new URLSearchParams(location.search).get("phone");

async function load(){
 let snap=await getDocs(collection(db,"orders"));
 let html="";
 snap.forEach(d=>{
 let o=d.data();
 if(o.phone===phone){
 html+=`<div>
 ID:${d.id}<br>Status:${o.status}<br>Total ₹${o.total}
 </div><hr>`;
 }
 });
 data.innerHTML=html||"No Orders";
}
load();
</script>
</body>
</html>
