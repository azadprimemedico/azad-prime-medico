<!DOCTYPE html>
<html>
<head>
<title>My Orders</title>
</head>
<body>

<h2>My Orders</h2>
<input type="text" id="phone" placeholder="Enter Phone">
<button onclick="loadOrders()">Load</button>

<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
});

const db = getFirestore(app);

window.loadOrders = async function(){

 let phone=document.getElementById("phone").value;
 let snap=await getDocs(collection(db,"orders"));

 let html="";

 snap.forEach(doc=>{
  let o=doc.data();

  if(o.phone===phone){
    html+=`
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
    <b>ID:</b> ${doc.id}<br>
    <b>Status:</b> ${o.status}<br>
    <b>Total:</b> ₹${o.total}<br>
    <b>Date:</b> ${o.date}
    </div>`;
  }
 });

 document.getElementById("orders").innerHTML=html;
}

</script>
</body>
</html>
