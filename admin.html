<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }

.box {
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input, textarea {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
    margin-top:5px;
    cursor:pointer;
}

.logout { background:red; }

.card {
    background:white;
    margin:10px;
    padding:10px;
    border-radius:8px;
    text-align:center;
}

#adminPanel { display:none; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">

<div class="box">
<h2>Product Management</h2>

<input type="text" id="name" placeholder="Product Name">
<input type="number" id="price" placeholder="Price">
<input type="text" id="category" placeholder="Category">
<input type="text" id="image" placeholder="Image URL">

<button onclick="addProduct()">Save Product</button>
<button class="logout" onclick="logout()">Logout</button>

<h3>Bulk Upload</h3>
<textarea id="bulkData" placeholder="Name,Price,Category,ImageURL"></textarea>
<button onclick="bulkUpload()">Upload Bulk</button>
</div>

<h3 style="text-align:center;">Products</h3>
<div id="productList"></div>

<h3 style="text-align:center;">Orders</h3>
<div id="orderList"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let editId = null;

// LOGIN
function login() {
    let email = email.value;
    let password = password.value;

    auth.signInWithEmailAndPassword(email, password)
    .then(() => alert("Login Successful ✅"))
    .catch(() => alert("Login Failed ❌"));
}

// LOGOUT
function logout(){
    auth.signOut();
}

// AUTH CHECK
auth.onAuthStateChanged(user => {
    if (user) {
        loginBox.style.display = "none";
        adminPanel.style.display = "block";
        loadProducts();
        loadOrders();
    } else {
        loginBox.style.display = "block";
        adminPanel.style.display = "none";
    }
});

// ADD / UPDATE PRODUCT
function addProduct() {

    let name = document.getElementById("name").value;
    let price = parseFloat(document.getElementById("price").value);
    let category = document.getElementById("category").value;
    let image = document.getElementById("image").value;

    if (!name || !price || !category || !image) {
        alert("Fill all fields");
        return;
    }

    if (editId) {
        db.collection("products").doc(editId).update({ name, price, category, image })
        .then(() => { alert("Updated ✅"); editId=null; loadProducts(); });
    } else {
        db.collection("products").add({ name, price, category, image })
        .then(() => { alert("Added ✅"); loadProducts(); });
    }

    document.querySelectorAll("input").forEach(i => i.value = "");
}

// LOAD PRODUCTS
function loadProducts() {
    db.collection("products").get().then(snapshot => {
        let html = "";

        snapshot.forEach(doc => {
            let p = doc.data();

            html += `
            <div class="card">
                <img src="${p.image}" width="100"><br>
                <b>${p.name}</b><br>
                ₹${p.price}<br>
                ${p.category}<br>
                <button onclick="editProduct('${doc.id}','${p.name}','${p.price}','${p.category}','${p.image}')">Edit</button>
                <button onclick="deleteProduct('${doc.id}')">Delete</button>
            </div>`;
        });

        productList.innerHTML = html;
    });
}

// EDIT
function editProduct(id, name, price, category, image) {
    document.getElementById("name").value = name;
    document.getElementById("price").value = price;
    document.getElementById("category").value = category;
    document.getElementById("image").value = image;
    editId = id;
}

// DELETE
function deleteProduct(id) {
    db.collection("products").doc(id).delete()
    .then(() => { alert("Deleted ✅"); loadProducts(); });
}

// BULK UPLOAD
async function bulkUpload() {

    let data = document.getElementById("bulkData").value.trim();
    if (!data) return alert("Paste data");

    let lines = data.split("\n");

    for (let line of lines) {
        let [name, price, category, image] = line.split(",");

        if (!name) continue;

        await db.collection("products").add({
            name: name.trim(),
            price: parseFloat(price),
            category: category.trim(),
            image: image.trim()
        });
    }

    alert("Bulk Upload Done ✅");
    bulkData.value="";
    loadProducts();
}

// LOAD ORDERS
function loadOrders(){
    db.collection("orders").get().then(snapshot => {
        let html="";

        snapshot.forEach(doc=>{
            let o=doc.data();

            html+=`
            <div class="card">
            <b>ID:</b> ${doc.id}<br>
            <b>Name:</b> ${o.name || ""}<br>
            <b>Phone:</b> ${o.phone}<br>
            <b>Total:</b> ₹${o.total}<br>

            <select onchange="updateStatus('${doc.id}', this.value)">
                <option ${o.status=="Pending"?"selected":""}>Pending</option>
                <option ${o.status=="Packed"?"selected":""}>Packed</option>
                <option ${o.status=="Out for Delivery"?"selected":""}>Out for Delivery</option>
                <option ${o.status=="Delivered"?"selected":""}>Delivered</option>
            </select>
            </div>`;
        });

        orderList.innerHTML=html;
    });
}

// UPDATE STATUS
function updateStatus(id,status){
    db.collection("orders").doc(id).update({status})
    .then(()=>{ alert("Updated ✅"); loadOrders(); });
}
</script>

</body>
</html>
