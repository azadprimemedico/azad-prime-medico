<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico",
  storageBucket: "azad-prime-medico.firebasestorage.app",
  messagingSenderId: "111274201862",
  appId: "1:111274201862:web:a052eff79eca9f7d1ac487"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// FIX: wait for page load
window.onload = function() {

    const loginBox = document.getElementById("loginBox");
    const adminPanel = document.getElementById("adminPanel");

    adminPanel.style.display = "none";

    // AUTH CHECK
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginBox.style.display = "none";
            adminPanel.style.display = "block";
        } else {
            loginBox.style.display = "block";
            adminPanel.style.display = "none";
        }
    });
};

// LOGIN
window.login = function() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
    .then(() => alert("Login Successful ✅"))
    .catch((error) => {
        console.error(error);
        alert("Login Failed ❌");
    });
};

// ADD PRODUCT
window.addProduct = async function() {

    if (!auth.currentUser) {
        alert("Login required ❌");
        return;
    }

    let name = document.getElementById("name").value;
    let price = parseFloat(document.getElementById("price").value);
    let image = document.getElementById("image").value;

    if (!name || !price || !image) {
        alert("Fill all fields");
        return;
    }

    try {
        await addDoc(collection(db, "products"), {
            name: name,
            price: price,
            image: image
        });

        alert("Product Added ✅");

        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("image").value = "";

    } catch (error) {
        console.error(error);
        alert("Error adding product");
    }
};

</script>
