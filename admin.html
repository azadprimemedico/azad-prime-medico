<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }

.box {
    max-width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
    margin-top:5px;
}

#adminPanel { display:none; }
</style>
</head>

<body>

<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="box" id="adminPanel">
<h2>Add Product</h2>
<input type="text" id="name" placeholder="Product Name">
<input type="number" id="price" placeholder="Price">
<input type="text" id="image" placeholder="Image URL">
<button onclick="addProduct()">Add Product</button>
</div>

<!-- PRODUCTS LIST -->
<h3 style="text-align:center;">All Products</h3>
<div id="productList"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico",
  storageBucket: "azad-prime-medico.firebasestorage.app",
  messagingSenderId: "111274201862",
  appId: "1:111274201862:web:a052eff79eca9f7d1ac487"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

// LOGIN
function login() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
    .then(() => alert("Login Successful ✅"))
    .catch(() => alert("Login Failed ❌"));
}

// AUTH CHECK
auth.onAuthStateChanged(function(user) {
    if (user) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadProducts();
    } else {
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("adminPanel").style.display = "none";
    }
});

// ADD PRODUCT
function addProduct() {

    if (!auth.currentUser) {
        alert("Login required ❌");
        return;
    }

    let name = document.getElementById("name").value;
    let price = parseFloat(document.getElementById("price").value);
    let image = document.getElementById("image").value;

    if (!name || !price || !image) {
        alert("Fill all fields");
        return;
    }

    db.collection("products").add({
        name: name,
        price: price,
        image: image
    })
    .then(() => {
        alert("Product Added ✅");
        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("image").value = "";
        loadProducts();
    });
}

// LOAD PRODUCTS
function loadProducts() {
    db.collection("products").get().then((snapshot) => {
        let html = "";

        snapshot.forEach((doc) => {
            let p = doc.data();

            html += `
            <div style="background:white;margin:10px;padding:10px;border-radius:8px;text-align:center;">
                <img src="${p.image}" width="100"><br>
                <b>${p.name}</b><br>
                ₹${p.price}<br>
                <button onclick="deleteProduct('${doc.id}')">Delete</button>
            </div>`;
        });

        document.getElementById("productList").innerHTML = html;
    });
}

// DELETE PRODUCT
function deleteProduct(id) {
    db.collection("products").doc(id).delete()
    .then(() => {
        alert("Deleted ✅");
        loadProducts();
    });
}
</script>

</body>
</html>
