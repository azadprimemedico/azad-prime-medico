<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }

.box {
    max-width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input, textarea {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
    margin-top:5px;
}

#adminPanel { display:none; }
</style>
</head>

<body>

<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="box" id="adminPanel">
<h2>Add / Edit Product</h2>
<input type="text" id="name" placeholder="Product Name">
<input type="number" id="price" placeholder="Price">
<input type="text" id="category" placeholder="Category (tablet/syrup/vitamin)">
<input type="text" id="image" placeholder="Image URL">
<button onclick="addProduct()">Save Product</button>

<h3>Bulk Upload</h3>
<textarea id="bulkData" placeholder="Example:
Dolo 650,30,tablet,https://image-url
Crocin,25,tablet,https://image-url"></textarea>

<button onclick="bulkUpload()">Upload Bulk Products</button>
</div>

<h3 style="text-align:center;">All Products</h3>
<div id="productList"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let editId = null;

// LOGIN
function login() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
    .then(() => alert("Login Successful ✅"))
    .catch(() => alert("Login Failed ❌"));
}

// AUTH CHECK
auth.onAuthStateChanged(function(user) {
    if (user) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadProducts();
    } else {
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("adminPanel").style.display = "none";
    }
});

// ADD / UPDATE PRODUCT
function addProduct() {

    let name = document.getElementById("name").value;
    let price = parseFloat(document.getElementById("price").value);
    let category = document.getElementById("category").value;
    let image = document.getElementById("image").value;

    if (!name || !price || !category || !image) {
        alert("Fill all fields");
        return;
    }

    if (editId) {
        db.collection("products").doc(editId).update({
            name, price, category, image
        }).then(() => {
            alert("Updated ✅");
            editId = null;
            loadProducts();
        });
    } else {
        db.collection("products").add({
            name, price, category, image
        }).then(() => {
            alert("Added ✅");
            loadProducts();
        });
    }

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("category").value = "";
    document.getElementById("image").value = "";
}

// LOAD PRODUCTS
function loadProducts() {
    db.collection("products").get().then((snapshot) => {
        let html = "";

        snapshot.forEach((doc) => {
            let p = doc.data();

            html += `
            <div style="background:white;margin:10px;padding:10px;border-radius:8px;text-align:center;">
                <img src="${p.image}" width="100"><br>
                <b>${p.name}</b><br>
                ₹${p.price}<br>
                <small>${p.category}</small><br>
                <button onclick="editProduct('${doc.id}','${p.name}','${p.price}','${p.category}','${p.image}')">Edit</button>
                <button onclick="deleteProduct('${doc.id}')">Delete</button>
            </div>`;
        });

        document.getElementById("productList").innerHTML = html;
    });
}

// EDIT
function editProduct(id, name, price, category, image) {
    document.getElementById("name").value = name;
    document.getElementById("price").value = price;
    document.getElementById("category").value = category;
    document.getElementById("image").value = image;
    editId = id;
}

// DELETE
function deleteProduct(id) {
    db.collection("products").doc(id).delete()
    .then(() => {
        alert("Deleted ✅");
        loadProducts();
    });
}

// BULK UPLOAD
function bulkUpload() {

    let data = document.getElementById("bulkData").value.trim();
    if (!data) {
        alert("Paste data first");
        return;
    }

    let lines = data.split("\n");

    lines.forEach(line => {
        let parts = line.split(",");
        if (parts.length < 4) return;

        db.collection("products").add({
            name: parts[0].trim(),
            price: parseFloat(parts[1]),
            category: parts[2].trim(),
            image: parts[3].trim()
        });
    });

    alert("Bulk Upload Done ✅");
    document.getElementById("bulkData").value = "";
    loadProducts();
}
</script>

</body>
</html>
