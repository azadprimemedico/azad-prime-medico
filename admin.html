<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }

.box {
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input, textarea {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
    margin-top:5px;
    cursor:pointer;
}

.logout { background:red; }

.card {
    background:white;
    margin:10px;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

#adminPanel { display:none; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">

<div class="box">
<h2>Product Management</h2>

<input type="text" id="name" placeholder="Product Name">
<input type="number" id="price" placeholder="Price">
<input type="text" id="category" placeholder="Category">
<input type="text" id="image" placeholder="Image URL">

<button onclick="addProduct()">Save Product</button>
<button class="logout" onclick="logout()">Logout</button>

<h3>Bulk Upload</h3>
<textarea id="bulkData" placeholder="Name,Price,Category,ImageURL"></textarea>
<button onclick="bulkUpload()">Upload Bulk</button>
</div>

<h3 style="text-align:center;">Products</h3>
<div id="productList"></div>

<h3 style="text-align:center;">Orders</h3>
<div id="orderList"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

// 🔐 LOGIN
function login() {
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("Enter Email & Password");
        return;
    }

    auth.signInWithEmailAndPassword(email, password)
    .then(() => {
        alert("Login Successful ✅");
    })
    .catch((err) => {
        console.error(err);
        alert("Login Failed ❌: " + err.message);
    });
}

// 🚪 LOGOUT
function logout(){
    auth.signOut();
}

// 🔁 AUTH STATE
auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadProducts();
        loadOrders();
    } else {
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("adminPanel").style.display = "none";
    }
});

// ➕ ADD PRODUCT
function addProduct() {
    let name = document.getElementById("name").value;
    let price = parseFloat(document.getElementById("price").value);
    let category = document.getElementById("category").value;
    let image = document.getElementById("image").value;

    if (!name || !price || !category || !image) {
        alert("Fill all fields");
        return;
    }

    db.collection("products").add({ name, price, category, image })
    .then(() => {
        alert("Product Added ✅");
        loadProducts();
    });
}

// 📦 LOAD PRODUCTS
function loadProducts() {
    db.collection("products").get().then(snapshot => {
        let html = "";
        snapshot.forEach(doc => {
            let p = doc.data();
            html += `
            <div class="card">
                <img src="${p.image}" width="100"><br>
                <b>${p.name}</b><br>
                ₹${p.price}<br>
                ${p.category}
            </div>`;
        });
        document.getElementById("productList").innerHTML = html;
    });
}

// 📦 LOAD ORDERS
function loadOrders(){
    db.collection("orders").get().then(snapshot => {
        let html="";
        snapshot.forEach(doc=>{
            let o=doc.data();
            html+=`
            <div class="card">
            <b>ID:</b> ${doc.id}<br>
            <b>Name:</b> ${o.name}<br>
            <b>Phone:</b> ${o.phone}<br>
            <b>Total:</b> ₹${o.total}
            </div>`;
        });
        document.getElementById("orderList").innerHTML=html;
    });
}

// 📥 BULK
async function bulkUpload() {
    let data = document.getElementById("bulkData").value.trim();
    let lines = data.split("\n");

    for (let line of lines) {
        let [name, price, category, image] = line.split(",");
        if (!name) continue;

        await db.collection("products").add({
            name: name.trim(),
            price: parseFloat(price),
            category: category.trim(),
            image: image.trim()
        });
    }

    alert("Bulk Upload Done ✅");
    loadProducts();
}
</script>

</body>
</html>
