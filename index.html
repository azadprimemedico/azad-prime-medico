<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f9; }

/* HEADER */
header {
    background:white;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo img { height:55px; } /* bigger logo */

/* HERO */
.hero {
    background: linear-gradient(135deg, #0f9b0f, #ff0000);
    color:white;
    padding:40px;
    text-align:center;
}

/* INPUT */
.inputs input {
    width:45%;
    padding:10px;
    margin:5px;
}

/* PRODUCTS */
.products { display:flex; flex-wrap:wrap; justify-content:center; }
.card {
    width:170px;
    background:white;
    margin:10px;
    padding:10px;
    border-radius:10px;
    text-align:center;
}

/* CART */
.cartBtn {
    background:green;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    cursor:pointer;
}

#cartPopup {
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:320px;
    height:100%;
    background:white;
    padding:15px;
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="logo.png">
</div>
<div class="cartBtn" onclick="openCart()">🛒 (<span id="count">0</span>)</div>
</header>

<div class="hero">
<h2>Online Medical Store</h2>
<p>Fast Delivery | Genuine Medicines</p>
</div>

<div class="inputs">
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Mobile">
</div>

<div class="products" id="products"></div>

<div id="cartPopup">
<h3>Cart</h3>
<div id="cartItems"></div>
<h4 id="total">₹0</h4>

<button onclick="placeOrder()">Place Order</button>
<button onclick="payNow()">Pay UPI</button>
<button onclick="closeCart()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const app = initializeApp({
 apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
 authDomain: "azad-prime-medico.firebaseapp.com",
 projectId: "azad-prime-medico"
});

const db = getFirestore(app);

let products = [];
let cart = [];

// LOAD PRODUCTS
async function load(){
 let snap = await getDocs(collection(db,"products"));
 products=[];
 snap.forEach(doc=>products.push({id:doc.id,...doc.data(),qty:1}));
 show(products);
}

// SHOW
function show(data){
 let html="";
 data.forEach(p=>{
  html+=`
  <div class="card">
   <img src="${p.image}" width="100">
   <h4>${p.name}</h4>
   ₹${p.price}
   <button onclick='add(${JSON.stringify(p)})'>Add</button>
  </div>`;
 });
 document.getElementById("products").innerHTML=html;
}

// ADD CART
window.add = function(p){
 let item = cart.find(i=>i.id===p.id);
 if(item) item.qty++;
 else cart.push({...p,qty:1});
 render();
}

// RENDER
function render(){
 let html=""; let total=0;

 cart.forEach((i,index)=>{
  total+=i.price*i.qty;
  html+=`${i.name} x${i.qty} ₹${i.price*i.qty}
  <button onclick="removeItem(${index})">X</button><br>`;
 });

 document.getElementById("cartItems").innerHTML=html;
 document.getElementById("total").innerText="₹"+total;
 document.getElementById("count").innerText=cart.length;
}

// REMOVE
window.removeItem = function(i){
 cart.splice(i,1);
 render();
}

// CART UI
window.openCart=()=>{document.getElementById("cartPopup").style.display="block"; render();}
window.closeCart=()=>document.getElementById("cartPopup").style.display="none";

// ✅ PLACE ORDER (FIXED)
window.placeOrder = async function(){

 try {

 let name = document.getElementById("name").value;
 let phone = document.getElementById("phone").value;

 if(!name || !phone || cart.length==0){
  alert("Fill details + add products");
  return;
 }

 let total = cart.reduce((s,i)=>s+i.price*i.qty,0);

 let order = {
  name,
  phone,
  items: cart,
  total,
  status:"Pending",
  date: new Date().toLocaleString()
 };

 let ref = await addDoc(collection(db,"orders"),order);

 alert("Order Placed ✅ ID: "+ref.id);

 generateInvoice(ref.id, order);

 cart=[];
 render();
 closeCart();

 } catch(err){
  alert("Error: "+err.message);
 }

}

// INVOICE
function generateInvoice(id,o){
 let html=`<h2>Invoice</h2>ID:${id}<br>Name:${o.name}<hr>`;
 o.items.forEach(i=>{
  html+=`${i.name} x${i.qty} ₹${i.price*i.qty}<br>`;
 });
 html+=`<hr>Total ₹${o.total}`;
 let w=window.open("");
 w.document.write(html);
 w.print();
}

// UPI
window.payNow=function(){
 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 window.open("upi://pay?pa=gulamhamid164@okaxis&pn=AzadPrimeMedico&am="+total);
}

load();

</script>

</body>
</html>
