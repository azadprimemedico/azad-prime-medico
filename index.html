<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f1f3f6; }

header {
    background:white;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.logo { font-weight:bold; color:red; }
.cart {
    background:green;
    color:white;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
}

.search-box { padding:10px; background:white; }
.search-box input {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

.banner {
    background:linear-gradient(90deg, green, red);
    color:white;
    padding:20px;
    text-align:center;
}

.categories {
    display:flex;
    overflow:auto;
    background:white;
    padding:10px;
}
.cat {
    margin:5px;
    padding:10px;
    background:#eee;
    border-radius:20px;
    cursor:pointer;
}

.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card {
    background:white;
    width:160px;
    margin:10px;
    padding:10px;
    border-radius:10px;
    text-align:center;
}
.card img {
    width:100%;
    height:120px;
    object-fit:cover;
}

button {
    background:red;
    color:white;
    border:none;
    padding:6px;
    margin-top:5px;
}

#cartPopup {
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:320px;
    height:100%;
    background:white;
    box-shadow:-3px 0 10px rgba(0,0,0,0.2);
    padding:15px;
    z-index:999;
    overflow:auto;
}
.checkoutBtn { background:green; width:100%; margin-top:10px; }
.closeBtn { background:gray; width:100%; }
</style>
</head>

<body>

<header>
<div class="logo">AZAD PRIME MEDICO</div>
<div class="cart" id="cartBox" onclick="openCart()">🛒 Cart (0)</div>
</header>

<div class="search-box">
<input type="text" id="search" placeholder="Search medicines...">
</div>

<div class="banner">
<h2>Online Medical Store - Ranchi</h2>
<p>Fast Delivery | Genuine Medicines</p>
</div>

<div class="categories">
<div class="cat" onclick="filterCategory('all')">All</div>
<div class="cat" onclick="filterCategory('tablet')">Tablets</div>
<div class="cat" onclick="filterCategory('syrup')">Syrup</div>
<div class="cat" onclick="filterCategory('vitamin')">Vitamins</div>
</div>

<div style="background:white;margin:10px;padding:15px;border-radius:10px;text-align:center;">
<h3>Upload Doctor Prescription</h3>
<input type="file" id="prescriptionFile"><br><br>
<button onclick="uploadPrescription()">Upload & Order</button>
</div>

<div class="products" id="product-list"></div>

<div id="cartPopup">
<h3>🛒 Your Cart</h3>
<div id="cartItems"></div>
<h4 id="cartTotal">Total: ₹0</h4>

<button class="checkoutBtn" onclick="payNow()">Pay via UPI</button>
<button class="checkoutBtn" onclick="checkout()">WhatsApp Order</button>
<button class="closeBtn" onclick="closeCart()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allProducts = [];
let cart = [];
let total = 0;

// ✅ FIXED LOAD
async function loadProducts() {
    const snapshot = await getDocs(collection(db, "products"));
    allProducts = [];
    snapshot.forEach(doc => {
        allProducts.push({
            id: doc.id,
            ...doc.data()
        });
    });
    displayProducts(allProducts);
}

// ✅ FIXED DISPLAY
function displayProducts(data) {
    let html = "";
    data.forEach(p => {
        html += `
        <div class="card">
            <img src="${p.image}">
            <h4>${p.name}</h4>
            <p>₹${p.price}</p>
            <button onclick='addToCart(${JSON.stringify(p)})'>Add</button>
        </div>`;
    });

    document.getElementById("product-list").innerHTML = html;
}

// CART
window.addToCart = function(p) {
    cart.push(p);
    total += Number(p.price);
    document.getElementById("cartBox").innerText = "🛒 Cart (" + cart.length + ")";
}

// OPEN CART
window.openCart = function() {
    document.getElementById("cartPopup").style.display = "block";
    renderCart();
}

// CLOSE CART
window.closeCart = function() {
    document.getElementById("cartPopup").style.display = "none";
}

// RENDER CART
function renderCart() {
    let html = "";

    cart.forEach((item, index) => {
        html += `
        <div style="border-bottom:1px solid #ddd; padding:8px;">
            ${item.name} - ₹${item.price}
            <button onclick="removeItem(${index})" style="float:right;background:red;">X</button>
        </div>`;
    });

    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("cartTotal").innerText = "Total: ₹" + total;
}

// REMOVE
window.removeItem = function(index) {
    total -= cart[index].price;
    cart.splice(index, 1);
    document.getElementById("cartBox").innerText = "🛒 Cart (" + cart.length + ")";
    renderCart();
}

// ✅ FIXED UPI
window.payNow = function() {
    if(total === 0){
        alert("Cart is empty");
        return;
    }
let upi = "upi://pay?pa=gulamhamid164@okaxis&pn=AzadPrimeMedico&am=" + total;
    window.open(upi);

    alert("Payment done? Send screenshot on WhatsApp ✅");
}

// WHATSAPP
window.checkout = function() {
    let message = "Order Details:%0A";
    cart.forEach(item => {
        message += item.name + " - ₹" + item.price + "%0A";
    });
    message += "Total: ₹" + total;

    window.open("https://wa.me/917633801161?text=" + message);
}

// PRESCRIPTION
window.uploadPrescription = function() {
    let fileInput = document.getElementById("prescriptionFile");

    if(fileInput.files.length === 0){
        alert("Please select prescription");
        return;
    }

    window.open("https://wa.me/917633801161?text=Sending prescription");
}

// SEARCH
document.getElementById("search").addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    let filtered = allProducts.filter(p => p.name.toLowerCase().includes(value));
    displayProducts(filtered);
});

// CATEGORY
window.filterCategory = function(cat) {
    if(cat === "all") {
        displayProducts(allProducts);
    } else {
        let filtered = allProducts.filter(p => p.category === cat);
        displayProducts(filtered);
    }
}

loadProducts();

</script>

</body>
</html>
