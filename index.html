<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }

header {
    background: linear-gradient(90deg, green, red);
    color:white;
    padding:15px;
    text-align:center;
}

.search {
    text-align:center;
    margin:10px;
}

input {
    padding:10px;
    width:80%;
    border-radius:20px;
}

.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card {
    background:white;
    margin:10px;
    padding:10px;
    width:200px;
    border-radius:10px;
}

img {
    width:100%;
    height:150px;
    object-fit:cover;
}

button {
    background:red;
    color:white;
    border:none;
    padding:8px;
}
</style>
</head>

<body>

<header>
<h1>AZAD PRIME MEDICO</h1>
<p>Online Medical Store - Ranchi</p>
</header>

<div class="search">
<input type="text" id="search" placeholder="Search medicines..." onkeyup="searchProduct()">
</div>

<div class="products" id="product-list"></div>

<script>
// 🔥 YOUR FIREBASE CONFIG (I will help you fill this)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Load products
function loadProducts() {
    db.collection("products").get().then((data) => {
        let html = "";
        data.forEach(doc => {
            let p = doc.data();
            html += `
            <div class="card">
                <img src="${p.image}">
                <h3>${p.name}</h3>
                <p>₹${p.price}</p>
                <button onclick="addToCart('${p.name}',${p.price})">Add</button>
            </div>`;
        });
        document.getElementById("product-list").innerHTML = html;
    });
}

loadProducts();

// Search
function searchProduct() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let name = card.innerText.toLowerCase();
        card.style.display = name.includes(input) ? "block" : "none";
    });
}
</script>

</body>
</html>
