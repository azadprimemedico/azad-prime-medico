<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logoBox">
    <img src="logo.png" class="logo">
    <div>
      <h2>Azad Prime Medico</h2>
      <small>Online Medical Store</small>
    </div>
  </div>

  <div class="cartBtn" onclick="viewCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </div>
</header>

<section class="hero">
  <h1>Fast Medicine Delivery</h1>
  <p>Order medicines online easily</p>
</section>

<div class="orderForm">
  <input type="text" id="custName" placeholder="Your Name">
  <input type="text" id="custPhone" placeholder="Mobile Number">
  <input type="text" id="custAddress" placeholder="Address">
</div>

<div class="searchBox">
  <input type="text" id="search" placeholder="Search Medicine..." onkeyup="searchProducts()">
</div>

<h2 class="sectionTitle">All Medicines</h2>

<div class="products" id="products"></div>

<div class="cartActions">
  <button onclick="placeOrder()">Save Order</button>
  <button onclick="whatsappOrder()">WhatsApp</button>
  <button onclick="upiPayment()">UPI</button>
  <button onclick="openInvoice()">Invoice</button>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
