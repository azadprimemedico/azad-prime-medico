<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#eef3f8; }

header {
    background:white;
    padding:12px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo img { height:60px; }

.cartBtn {
    background:#0f9b0f;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    cursor:pointer;
}

.hero {
    background:linear-gradient(135deg,#0f9b0f,#ff4d4d);
    color:white;
    padding:40px;
    text-align:center;
}

.inputs { padding:10px; text-align:center; }
.inputs input {
    padding:10px;
    margin:5px;
    width:45%;
}

.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card {
    background:white;
    width:170px;
    margin:10px;
    padding:10px;
    border-radius:10px;
    text-align:center;
}

#cartPopup {
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:320px;
    height:100%;
    background:white;
    padding:15px;
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="logo.png">
</div>
<div class="cartBtn" onclick="openCart()">🛒 (<span id="cartCount">0</span>)</div>
</header>

<div class="hero">
<h2>Online Medical Store</h2>
</div>

<div class="inputs">
<input type="text" id="name" placeholder="Name">
<input type="text" id="phone" placeholder="Phone">
</div>

<div class="products" id="product-list"></div>

<div id="cartPopup">
<h3>Cart</h3>
<div id="cartItems"></div>
<h4 id="total"></h4>

<button onclick="placeOrder()">Place Order</button>
<button onclick="payNow()">Pay</button>
<button onclick="trackOrder()">Track</button>
<button onclick="closeCart()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
 authDomain:"azad-prime-medico.firebaseapp.com",
 projectId:"azad-prime-medico"
});

const db=getFirestore(app);

let products=[], cart=[];

// LOAD
async function loadProducts(){
 let snap=await getDocs(collection(db,"products"));
 products=[];
 snap.forEach(doc=>{
  products.push({id:doc.id,...doc.data(),qty:1});
 });
 display(products);
}

function display(data){
 let html="";
 data.forEach(p=>{
  html+=`
  <div class="card">
   <img src="${p.image}" width="100%">
   <h4>${p.name}</h4>
   ₹${p.price}
   <button onclick='add(${JSON.stringify(p)})'>Add</button>
  </div>`;
 });
 document.getElementById("product-list").innerHTML=html;
}

// CART
window.add=function(p){
 let f=cart.find(i=>i.id==p.id);
 if(f) f.qty++;
 else cart.push({...p});
 render();
}

function render(){
 let html="", total=0;

 cart.forEach((i,idx)=>{
  total+=i.price*i.qty;
  html+=`${i.name} x${i.qty} = ₹${i.price*i.qty}
  <button onclick="removeItem(${idx})">X</button><br>`;
 });

 document.getElementById("cartItems").innerHTML=html;
 document.getElementById("total").innerText="Total ₹"+total;
 document.getElementById("cartCount").innerText=cart.length;
}

window.removeItem=i=>{ cart.splice(i,1); render(); }

window.openCart=()=>{cartPopup.style.display="block";render();}
window.closeCart=()=>cartPopup.style.display="none";

// ORDER
window.placeOrder=async function(){

 let name=nameInput();
 let phone=phoneInput();

 if(!name||!phone||cart.length==0){
  alert("Fill all");
  return;
 }

 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);

 let order={
  name,phone,
  items:cart,
  total,
  status:"Pending",
  payment:"Pending",
  date:new Date().toLocaleString()
 };

 let ref=await addDoc(collection(db,"orders"),order);

 alert("Order ID: "+ref.id);

 invoice(ref.id,order);

 cart=[];
 render();
 closeCart();
}

// INPUT FIX
function nameInput(){ return document.getElementById("name").value; }
function phoneInput(){ return document.getElementById("phone").value; }

// INVOICE FIX
function invoice(id,o){
 let w=window.open("");
 w.document.write(`
 <h2>Azad Prime Medico</h2>
 ID:${id}<br>
 ${o.name}<br>${o.phone}<hr>
 ${o.items.map(i=>i.name+" x"+i.qty).join("<br>")}
 <hr>Total ₹${o.total}
 `);
 w.document.close();
}

// UPI
window.payNow=function(){
 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 window.open("upi://pay?pa=gulamhamid164@okaxis&pn=Azad&am="+total);
}

// TRACK
window.trackOrder=function(){
 let phone=phoneInput();
 window.open("orders.html?phone="+phone);
}

loadProducts();

</script>

</body>
</html>
