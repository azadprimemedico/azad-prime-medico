<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logoBox">
<img src="logo.png">
<h2>Azad Prime Medico</h2>
</div>

<div class="cartBtn" onclick="openCart()">
🛒 <span id="cartCount">0</span>
</div>
</header>

<section class="hero">
<h1>Online Medical Store</h1>
<p>Fast Delivery | Genuine Medicines | Best Prices</p>
</section>

<div class="searchBox">
<input type="text" placeholder="Search Medicine..." onkeyup="searchProducts(this.value)">
</div>

<h2 class="title">Products</h2>
<div id="products" class="products"></div>

<footer>
<p>© Azad Prime Medico</p>
</footer>

<script type="module" src="script.js"></script>
</body>
</html>
