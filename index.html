<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
header {
    background: linear-gradient(90deg, green, red);
    color:white;
    padding:15px;
    text-align:center;
}
.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card {
    background:white;
    margin:10px;
    padding:10px;
    width:200px;
    border-radius:10px;
}
img {
    width:100%;
    height:150px;
    object-fit:cover;
}
button {
    background:red;
    color:white;
    border:none;
    padding:8px;
}
</style>
</head>

<body>

<header>
<h1>AZAD PRIME MEDICO</h1>
<p>Online Medical Store - Ranchi</p>
</header>

<div class="products" id="product-list"></div>

<!-- FIREBASE SCRIPT -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico",
  storageBucket: "azad-prime-medico.firebasestorage.app",
  messagingSenderId: "111274201862",
  appId: "1:111274201862:web:a052eff79eca9f7d1ac487"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// LOAD PRODUCTS
async function loadProducts() {
    const querySnapshot = await getDocs(collection(db, "products"));
    let html = "";

    querySnapshot.forEach((doc) => {
        let p = doc.data();
        html += `
        <div class="card">
            <img src="${p.image}">
            <h3>${p.name}</h3>
            <p>₹${p.price}</p>
        </div>`;
    });

    document.getElementById("product-list").innerHTML = html;
}

loadProducts();

</script>

</body>
</html>
