<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:'Segoe UI',Arial;
    background: linear-gradient(-45deg,#e6f7ff,#f0fff0,#fff5f5,#eef3f8);
    background-size:400% 400%;
    animation: bg 10s infinite;
}
@keyframes bg {
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header {
    background:white;
    padding:12px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo img { height:65px; }

.cartBtn {
    background:linear-gradient(45deg,#0f9b0f,#38ef7d);
    color:white;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
}

.hero {
    background:linear-gradient(135deg,#0f9b0f,#ff4d4d);
    color:white;
    padding:40px;
    text-align:center;
}

.inputs { text-align:center; padding:15px; }
.inputs input {
    padding:12px;
    margin:5px;
    width:45%;
    border-radius:20px;
}

.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card {
    background:white;
    width:180px;
    margin:10px;
    padding:10px;
    border-radius:12px;
    text-align:center;
}
.card img {
    width:100%;
    height:130px;
    object-fit:cover;
}

button {
    background:#ff4d4d;
    color:white;
    border:none;
    padding:8px;
    border-radius:6px;
}

#cartPopup {
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:320px;
    height:100%;
    background:white;
    padding:15px;
}
</style>
</head>

<body>

<header>
<div class="logo"><img src="logo.png"></div>
<div class="cartBtn" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</div>
</header>

<div class="hero">
<h2>Online Medical Store</h2>
<p>Fast Delivery | Genuine Medicines</p>
</div>

<div class="inputs">
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Mobile Number">
</div>

<div class="products" id="list"></div>

<div id="cartPopup">
<h3>Cart</h3>
<div id="items"></div>
<h4 id="total">Total ₹0</h4>

<button onclick="placeOrder()">Place Order</button>
<button onclick="closeCart()">Close</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

/* ✅ ONLY ONE FIREBASE INIT */
const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let cart = [];

/* LOAD PRODUCTS */
async function load(){
 let snap = await getDocs(collection(db,"products"));
 products = [];

 snap.forEach(d=>{
  products.push({id:d.id,...d.data(),qty:1});
 });

 console.log("Products:", products);
 show(products);
}

/* SHOW */
function show(data){
 let html="";
 data.forEach(p=>{
 html+=`
 <div class="card">
 <img src="${p.image}">
 <h4>${p.name}</h4>
 ₹${p.price}
 <button onclick='add(${JSON.stringify(p)})'>Add</button>
 </div>`;
 });
 document.getElementById("list").innerHTML=html;
}

/* ADD CART */
window.add = (p)=>{
 let i = cart.find(x=>x.id===p.id);
 if(i) i.qty++;
 else cart.push({...p,qty:1});
 render();
}

/* RENDER */
function render(){
 let html="",t=0;

 cart.forEach((i,ind)=>{
 t+=i.price*i.qty;
 html+=`${i.name} x${i.qty} ₹${i.price*i.qty}
 <button onclick="remove(${ind})">X</button><br>`;
 });

 document.getElementById("items").innerHTML=html;
 document.getElementById("total").innerText="Total ₹"+t;
 document.getElementById("count").innerText=cart.length;
}

/* REMOVE */
window.remove = (i)=>{
 cart.splice(i,1);
 render();
}

/* CART UI */
window.openCart = ()=>{cartPopup.style.display="block"; render();}
window.closeCart = ()=>cartPopup.style.display="none";

/* PLACE ORDER FIXED */
window.placeOrder = async function(){

 let n = document.getElementById("name").value.trim();
 let p = document.getElementById("phone").value.trim();

 if(n === "" || p === "" || cart.length === 0){
  alert("Please enter Name, Phone and add product");
  return;
 }

 let t = cart.reduce((s,i)=>s + (i.price * i.qty), 0);

 let orderData = {
  name:n,
  phone:p,
  items:cart,
  total:t,
  status:"Pending",
  date:new Date().toLocaleString()
 };

 try{
   let ref = await addDoc(collection(db,"orders"), orderData);

   alert("Order Placed ✅ ID: " + ref.id);

   generateInvoice(ref.id, orderData);

   cart = [];
   render();
   closeCart();

 }catch(err){
   console.error(err);
   alert("Order failed ❌");
 }
}

/* INVOICE */
function generateInvoice(id,o){
 let html=`
 <h2>Azad Prime Medico</h2>
 Order ID: ${id}<br>
 Name: ${o.name}<br>
 Phone: ${o.phone}<hr>`;

 o.items.forEach(i=>{
  html+=`${i.name} x${i.qty} = ₹${i.price*i.qty}<br>`;
 });

 html+=`<hr>Total ₹${o.total}`;

 let w = window.open("");
 w.document.write(html);
 w.document.close();
 w.print();
}

/* START */
load();
</script>

</body>
</html>
