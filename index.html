<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f1f3f6; }

header {
    background:white;
    padding:10px;
    display:flex;
    justify-content:space-between;
}
.logo { font-weight:bold; color:red; }
.cart {
    background:green;
    color:white;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
}

.products { display:flex; flex-wrap:wrap; justify-content:center; }
.card {
    background:white;
    width:160px;
    margin:10px;
    padding:10px;
    border-radius:10px;
    text-align:center;
}

#cartPopup {
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:320px;
    height:100%;
    background:white;
    padding:15px;
    overflow:auto;
}

input { padding:8px; margin:5px; width:90%; }
button { padding:8px; margin-top:5px; }
</style>
</head>

<body>

<header>
<div class="logo">AZAD PRIME MEDICO</div>
<div class="cart" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
</header>

<div style="padding:10px;">
<input type="text" id="name" placeholder="Customer Name">
<input type="text" id="phone" placeholder="Phone Number">
</div>

<div class="products" id="product-list"></div>

<div id="cartPopup">
<h3>Cart</h3>
<div id="cartItems"></div>
<h4 id="total">Total ₹0</h4>

<button onclick="placeOrder()">Place Order</button>
<button onclick="payNow()">Pay UPI</button>
<button onclick="closeCart()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
});

const db = getFirestore(app);

let products=[], cart=[];

// LOAD PRODUCTS
async function loadProducts(){
 let snap = await getDocs(collection(db,"products"));
 snap.forEach(doc=>{
  products.push({id:doc.id,...doc.data(),qty:1});
 });
 display(products);
}

function display(data){
 let html="";
 data.forEach(p=>{
  html+=`
  <div class="card">
   <img src="${p.image}" width="100">
   <h4>${p.name}</h4>
   ₹${p.price}<br>
   <button onclick='add(${JSON.stringify(p)})'>Add</button>
  </div>`;
 });
 document.getElementById("product-list").innerHTML=html;
}

// ADD CART (WITH QTY)
window.add=function(p){
 let item=cart.find(i=>i.id===p.id);
 if(item){ item.qty++; }
 else cart.push({...p,qty:1});
 render();
}

// RENDER CART
function render(){
 let html=""; let total=0;

 cart.forEach((i,index)=>{
  total+=i.price*i.qty;
  html+=`
  <div>
   ${i.name} x${i.qty} = ₹${i.price*i.qty}
   <button onclick="removeItem(${index})">X</button>
  </div>`;
 });

 document.getElementById("cartItems").innerHTML=html;
 document.getElementById("total").innerText="Total ₹"+total;
 document.getElementById("cartCount").innerText=cart.length;
}

// REMOVE
window.removeItem=function(i){
 cart.splice(i,1);
 render();
}

// CART OPEN
window.openCart=()=>document.getElementById("cartPopup").style.display="block";
window.closeCart=()=>document.getElementById("cartPopup").style.display="none";

// PLACE ORDER
window.placeOrder=async function(){

 let name=document.getElementById("name").value;
 let phone=document.getElementById("phone").value;

 if(!name||!phone||cart.length==0){
  alert("Fill details + cart");
  return;
 }

 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);

 let order={
  name, phone,
  items:cart,
  total,
  status:"Pending",
  date:new Date().toLocaleString()
 };

 let ref=await addDoc(collection(db,"orders"),order);

 generateInvoice(ref.id,order);

 cart=[];
 render();
 closeCart();
}

// INVOICE
function generateInvoice(id,o){

 let html=`
 <h2>Azad Prime Medico</h2>
 Order ID: ${id}<br>
 Name: ${o.name}<br>
 Phone: ${o.phone}<br><hr>`;

 o.items.forEach(i=>{
  html+=`${i.name} x${i.qty} = ₹${i.price*i.qty}<br>`;
 });

 html+=`<hr>Total ₹${o.total}<br>Status: ${o.status}`;

 let w=window.open("");
 w.document.write(html);
 w.print();
}

// UPI
window.payNow=function(){
 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 window.open("upi://pay?pa=gulamhamid164@okaxis&pn=Azad&am="+total);
}

loadProducts();

</script>
</body>
</html>
