<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f9; }

/* HEADER */
header {
    background:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo img {
    height:60px;   /* 🔥 LOGO BIGGER */
}

/* HERO */
.hero {
    background: linear-gradient(135deg, #0f9b0f, #ff0000);
    color:white;
    padding:40px;
    text-align:center;
}

/* INPUT */
.inputs { text-align:center; padding:10px; }
.inputs input {
    padding:10px;
    width:45%;
    margin:5px;
}

/* PRODUCTS */
.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card {
    background:white;
    width:180px;
    margin:10px;
    padding:10px;
    border-radius:10px;
}
.card img {
    width:100%;
    height:130px;
    object-fit:cover;
}

button {
    background:red;
    color:white;
    border:none;
    padding:8px;
    width:100%;
}

/* CART */
.cartBtn {
    background:green;
    padding:10px 15px;
    color:white;
    border-radius:20px;
    cursor:pointer;
}

#cartPopup {
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:320px;
    height:100%;
    background:white;
    padding:15px;
    overflow:auto;
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="logo.png">
</div>
<div class="cartBtn" onclick="openCart()">🛒 (<span id="count">0</span>)</div>
</header>

<div class="hero">
<h1>Online Medical Store</h1>
<p>Fast Delivery | Genuine Medicines</p>
</div>

<div class="inputs">
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Mobile">
</div>

<div class="products" id="products"></div>

<div id="cartPopup">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<h4 id="total"></h4>

<button onclick="placeOrder()">Place Order</button>
<button onclick="payNow()">Pay UPI</button>
<button onclick="goOrders()">My Orders</button>
<button onclick="closeCart()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
});

const db = getFirestore(app);

let products=[];
let cart=[];

// LOAD PRODUCTS
async function load(){
 let snap=await getDocs(collection(db,"products"));
 products=[];
 snap.forEach(d=>products.push({id:d.id,...d.data(),qty:1}));
 show(products);
}

// DISPLAY
function show(data){
 let html="";
 data.forEach(p=>{
 html+=`
 <div class="card">
 <img src="${p.image}">
 <h4>${p.name}</h4>
 ₹${p.price}
 <button onclick='add(${JSON.stringify(p)})'>Add</button>
 </div>`;
 });
 document.getElementById("products").innerHTML=html;
}

// ADD CART
window.add=(p)=>{
 let f=cart.find(i=>i.id===p.id);
 if(f) f.qty++;
 else cart.push({...p,qty:1});
 render();
}

// RENDER CART
function render(){
 let html=""; let total=0;

 cart.forEach((i,index)=>{
 total+=i.price*i.qty;
 html+=`${i.name} x${i.qty} ₹${i.price*i.qty}
 <button onclick="remove(${index})">X</button><br>`;
 });

 document.getElementById("cartItems").innerHTML=html;
 document.getElementById("total").innerText="Total ₹"+total;
 document.getElementById("count").innerText=cart.length;
}

// REMOVE
window.remove=(i)=>{
 cart.splice(i,1);
 render();
}

// CART UI
window.openCart=()=>{document.getElementById("cartPopup").style.display="block"; render();}
window.closeCart=()=>document.getElementById("cartPopup").style.display="none";

// PLACE ORDER
window.placeOrder=async()=>{
 let name=document.getElementById("name").value;
 let phone=document.getElementById("phone").value;

 if(!name||!phone||cart.length==0){
 alert("Fill details");
 return;
 }

 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);

 let ref=await addDoc(collection(db,"orders"),{
 name,phone,items:cart,total,
 status:"Pending",
 date:new Date().toLocaleString()
 });

 alert("Order ID: "+ref.id);

 cart=[];
 render();
}

// PAYMENT
window.payNow=()=>{
 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 window.open("upi://pay?pa=gulamhamid164@okaxis&pn=AzadPrimeMedico&am="+total);
}

// ORDERS PAGE
window.goOrders=()=>{
 window.location.href="orders.html";
}

load();

</script>

</body>
</html>
