<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f9; }

/* HEADER */
header {
    background:white;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.logo img { height:40px; }

/* HERO */
.hero {
    background: linear-gradient(135deg, #0f9b0f, #ff0000);
    color:white;
    padding:40px 20px;
    text-align:center;
}

/* INPUT */
.inputs {
    padding:10px;
    text-align:center;
}
.inputs input {
    padding:10px;
    margin:5px;
    width:45%;
    border-radius:8px;
    border:1px solid #ccc;
}

/* PRODUCTS */
.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card {
    background:white;
    width:170px;
    margin:10px;
    padding:10px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.card img {
    width:100%;
    height:120px;
    object-fit:cover;
}

button {
    background:red;
    color:white;
    border:none;
    padding:8px;
    margin-top:5px;
    border-radius:6px;
    cursor:pointer;
}

/* CART */
.cartBtn {
    background:green;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    cursor:pointer;
}

#cartPopup {
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:320px;
    height:100%;
    background:white;
    padding:15px;
    overflow:auto;
    box-shadow:-3px 0 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<header>
<div class="logo">
    <img src="logo.png" alt="Logo">
</div>
<div class="cartBtn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
</header>

<div class="hero">
<h1>Online Medical Store - Ranchi</h1>
<p>Fast Delivery | Genuine Medicines</p>
</div>

<div class="inputs">
<input type="text" id="custName" placeholder="Your Name">
<input type="text" id="custPhone" placeholder="Mobile Number">
</div>

<div class="products" id="product-list"></div>

<div id="cartPopup">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<h4 id="total">Total ₹0</h4>

<button onclick="placeOrder()">Place Order</button>
<button onclick="payNow()">Pay UPI</button>
<button onclick="closeCart()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
});

const db = getFirestore(app);

let products = [];
let cart = [];

// LOAD PRODUCTS (FIXED)
async function loadProducts(){
 try{
   let snap = await getDocs(collection(db,"products"));
   products = [];
   snap.forEach(doc=>{
     products.push({id:doc.id,...doc.data(),qty:1});
   });
   display(products);
 }catch(e){
   alert("Error loading products ❌");
   console.error(e);
 }
}

// DISPLAY
function display(data){
 let html="";
 data.forEach(p=>{
  html+=`
  <div class="card">
   <img src="${p.image}">
   <h4>${p.name}</h4>
   ₹${p.price}
   <button onclick='addToCart(${JSON.stringify(p)})'>Add</button>
  </div>`;
 });
 document.getElementById("product-list").innerHTML=html;
}

// ADD CART (FIXED)
window.addToCart=function(p){
 let item=cart.find(i=>i.id===p.id);
 if(item){ item.qty++; }
 else cart.push({...p,qty:1});
 renderCart();
}

// RENDER CART
function renderCart(){
 let html=""; 
 let total=0;

 cart.forEach((i,index)=>{
  total+=i.price*i.qty;
  html+=`
  <div>
  ${i.name} x${i.qty} = ₹${i.price*i.qty}
  <button onclick="removeItem(${index})">X</button>
  </div>`;
 });

 document.getElementById("cartItems").innerHTML=html;
 document.getElementById("total").innerText="Total ₹"+total;
 document.getElementById("cartCount").innerText=cart.length;
}

// REMOVE
window.removeItem=function(i){
 cart.splice(i,1);
 renderCart();
}

// CART UI
window.openCart=()=>{
 document.getElementById("cartPopup").style.display="block";
 renderCart();
}
window.closeCart=()=>{
 document.getElementById("cartPopup").style.display="none";
}

// PLACE ORDER (SAVE FIREBASE + INVOICE)
window.placeOrder=async function(){

 let name=document.getElementById("custName").value;
 let phone=document.getElementById("custPhone").value;

 if(!name || !phone || cart.length===0){
  alert("Enter name, phone & add items");
  return;
 }

 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);

 let order={
  name, phone,
  items:cart,
  total,
  status:"Pending",
  date:new Date().toLocaleString()
 };

 let ref=await addDoc(collection(db,"orders"),order);

 alert("Order Placed ✅ ID: "+ref.id);

 generateInvoice(ref.id,order);

 cart=[];
 renderCart();
 closeCart();
}

// INVOICE
function generateInvoice(id,o){

 let html=`
 <div style="width:300px">
 <h2>Azad Prime Medico</h2>
 Order ID: ${id}<br>
 Name: ${o.name}<br>
 Phone: ${o.phone}<hr>`;

 o.items.forEach(i=>{
  html+=`${i.name} x${i.qty} = ₹${i.price*i.qty}<br>`;
 });

 html+=`<hr>Total ₹${o.total}<br>Status: ${o.status}</div>`;

 let w=window.open("");
 w.document.write(html);
 w.print();
}

// UPI PAYMENT
window.payNow=function(){
 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 if(total===0){
  alert("Cart empty");
  return;
 }
 window.open("upi://pay?pa=gulamhamid164@okaxis&pn=AzadPrimeMedico&am="+total);
}

loadProducts();

</script>

</body>
</html>
