<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f1f3f6; }

/* HEADER */
header {
    background:white;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.logo {
    font-weight:bold;
    color:red;
}
.cart {
    background:green;
    color:white;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
}

/* SEARCH */
.search-box {
    padding:10px;
    background:white;
}
.search-box input {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

/* BANNER */
.banner {
    background:linear-gradient(90deg, green, red);
    color:white;
    padding:20px;
    text-align:center;
}

/* CATEGORIES */
.categories {
    display:flex;
    overflow:auto;
    background:white;
    padding:10px;
}
.cat {
    margin:5px;
    padding:10px;
    background:#eee;
    border-radius:20px;
    cursor:pointer;
}

/* PRODUCTS */
.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card {
    background:white;
    width:160px;
    margin:10px;
    padding:10px;
    border-radius:10px;
    text-align:center;
}
.card img {
    width:100%;
    height:120px;
    object-fit:cover;
}
button {
    background:red;
    color:white;
    border:none;
    padding:6px;
    margin-top:5px;
}
.checkout {
    position:fixed;
    bottom:20px;
    right:20px;
    background:green;
    color:white;
    padding:15px;
    border:none;
    border-radius:10px;
}
</style>
</head>

<body>

<header>
<div class="logo">AZAD PRIME MEDICO</div>
<div class="cart" id="cartBox">🛒 Cart (0)</div>
</header>

<div class="search-box">
<input type="text" id="search" placeholder="Search medicines..." onkeyup="searchProducts()">
</div>

<div class="banner">
<h2>Online Medical Store - Ranchi</h2>
<p>Fast Delivery | Genuine Medicines</p>
</div>

<div class="categories">
<div class="cat" onclick="filterCategory('all')">All</div>
<div class="cat" onclick="filterCategory('tablet')">Tablets</div>
<div class="cat" onclick="filterCategory('syrup')">Syrup</div>
<div class="cat" onclick="filterCategory('vitamin')">Vitamins</div>
</div>

<div class="products" id="product-list"></div>

<button class="checkout" onclick="checkout()">Checkout</button>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allProducts = [];
let cart = [];
let total = 0;

// LOAD PRODUCTS
async function loadProducts() {
    const snapshot = await getDocs(collection(db, "products"));
    allProducts = [];
    snapshot.forEach(doc => {
        allProducts.push(doc.data());
    });
    displayProducts(allProducts);
}

// DISPLAY
function displayProducts(data) {
    let html = "";
    data.forEach(p => {
        html += `
        <div class="card">
            <img src="${p.image}">
            <h4>${p.name}</h4>
            <p>₹${p.price}</p>
            <button onclick="addToCart('${p.name}', ${p.price})">Add</button>
        </div>`;
    });
    document.getElementById("product-list").innerHTML = html;
}

// ADD TO CART
window.addToCart = function(name, price) {
    cart.push({name, price});
    total += price;
    document.getElementById("cartBox").innerText = "🛒 Cart (" + cart.length + ")";
}

// CHECKOUT
window.checkout = function() {

    if(cart.length === 0){
        alert("Cart is empty");
        return;
    }

    let message = "Order Details:%0A";

    cart.forEach(item => {
        message += item.name + " - ₹" + item.price + "%0A";
    });

    message += "Total: ₹" + total;

    window.open("https://wa.me/917633801161?text=" + message);
}

// SEARCH
window.searchProducts = function() {
    let value = document.getElementById("search").value.toLowerCase();
    let filtered = allProducts.filter(p => p.name.toLowerCase().includes(value));
    displayProducts(filtered);
}

// CATEGORY FILTER
window.filterCategory = function(cat) {
    if(cat === "all") {
        displayProducts(allProducts);
    } else {
        let filtered = allProducts.filter(p => p.category === cat);
        displayProducts(filtered);
    }
}

loadProducts();

</script>

</body>
</html>
