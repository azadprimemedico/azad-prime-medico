<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h2>Azad Prime Medico</h2>
<button onclick="openCart()">Cart (<span id="count">0</span>)</button>
</header>

<div class="form">
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Mobile Number">
<input id="address" placeholder="Delivery Address">
<input id="pincode" placeholder="Pincode">
</div>

<input id="search" placeholder="Search medicine..." onkeyup="searchProduct()">

<div id="products" class="products"></div>

<div id="cartPopup" class="cart">
<h3>Cart</h3>
<div id="cartItems"></div>
<h4 id="total">Total ₹0</h4>
<button onclick="placeOrder()">Place Order</button>
<button onclick="trackOrder()">Track Order</button>
<button onclick="closeCart()">Close</button>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
