<!DOCTYPE html>
<html>
<head>
<title>Azad Prime Medico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
 margin:0;
 font-family:Arial;
 background:#eef3f8;
}

/* HEADER */
header {
 background:white;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.logo img { height:60px; }

.cartBtn {
 background:green;
 color:white;
 padding:10px 15px;
 border-radius:20px;
 cursor:pointer;
}

/* HERO */
.hero {
 background:linear-gradient(135deg,#0f9b0f,#ff4d4d);
 color:white;
 padding:30px;
 text-align:center;
}

/* INPUT */
.inputs {
 text-align:center;
 padding:10px;
}
.inputs input {
 padding:10px;
 margin:5px;
 width:45%;
}

/* PRODUCTS */
.products {
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
}
.card {
 background:white;
 width:160px;
 margin:10px;
 padding:10px;
 text-align:center;
 border-radius:10px;
}
.card img {
 width:100%;
 height:120px;
 object-fit:cover;
}

button {
 background:red;
 color:white;
 border:none;
 padding:8px;
 margin-top:5px;
 cursor:pointer;
}

/* CART */
#cartPopup {
 display:none;
 position:fixed;
 right:0;
 top:0;
 width:300px;
 height:100%;
 background:white;
 padding:15px;
 overflow:auto;
}
</style>
</head>

<body>

<header>
<div class="logo"><img src="logo.png"></div>
<div class="cartBtn" onclick="openCart()">Cart (<span id="count">0</span>)</div>
</header>

<div class="hero">
<h2>Online Medical Store</h2>
<p>Fast Delivery | Genuine Medicines</p>
</div>

<div class="inputs">
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Mobile Number">
</div>

<div class="products" id="list"></div>

<div id="cartPopup">
<h3>Cart</h3>
<div id="items"></div>
<h4 id="total">Total ₹0</h4>

<button onclick="placeOrder()">Place Order</button>
<button onclick="closeCart()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCqpzQlN_qu53CKbPa_XFDnoyN6SgxhKRw",
  authDomain: "azad-prime-medico.firebaseapp.com",
  projectId: "azad-prime-medico"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* GLOBAL */
let products = [];
let cart = [];

/* LOAD PRODUCTS */
async function loadProducts(){
 try{
  const snap = await getDocs(collection(db,"products"));
  products = [];

  snap.forEach(doc=>{
    products.push({id:doc.id,...doc.data(),qty:1});
  });

  console.log("Products Loaded:", products);
  displayProducts();

 }catch(err){
  console.error("Load Error:", err);
 }
}

/* DISPLAY */
function displayProducts(){
 let html = "";

 products.forEach(p=>{
  html += `
  <div class="card">
   <img src="${p.image}">
   <h4>${p.name}</h4>
   ₹${p.price}
   <button onclick='addToCart(${JSON.stringify(p)})'>Add</button>
  </div>`;
 });

 document.getElementById("list").innerHTML = html;
}

/* ADD TO CART */
window.addToCart = function(p){
 let item = cart.find(i=>i.id===p.id);

 if(item){
   item.qty++;
 }else{
   cart.push({...p, qty:1});
 }

 renderCart();
}

/* RENDER CART */
function renderCart(){
 let html = "";
 let total = 0;

 cart.forEach((i,index)=>{
   total += i.price * i.qty;

   html += `
   ${i.name} x${i.qty} = ₹${i.price*i.qty}
   <button onclick="removeItem(${index})">X</button><br>`;
 });

 document.getElementById("items").innerHTML = html;
 document.getElementById("total").innerText = "Total ₹"+total;
 document.getElementById("count").innerText = cart.length;
}

/* REMOVE */
window.removeItem = function(index){
 cart.splice(index,1);
 renderCart();
}

/* CART UI */
window.openCart = function(){
 document.getElementById("cartPopup").style.display="block";
 renderCart();
}

window.closeCart = function(){
 document.getElementById("cartPopup").style.display="none";
}

/* PLACE ORDER (MAIN FIX) */
window.placeOrder = async function(){

 let name = document.getElementById("name").value.trim();
 let phone = document.getElementById("phone").value.trim();

 console.log("CLICK WORKING");

 if(!name || !phone || cart.length === 0){
   alert("Enter Name + Phone + Add Product");
   return;
 }

 let total = cart.reduce((s,i)=>s+i.price*i.qty,0);

 try{
   let ref = await addDoc(collection(db,"orders"),{
     name:name,
     phone:phone,
     items:cart,
     total:total,
     status:"Pending",
     date:new Date().toLocaleString()
   });

   alert("Order Placed ✅ ID: "+ref.id);

   cart = [];
   renderCart();
   closeCart();

 }catch(err){
   console.error("Order Error:", err);
   alert("Order Failed ❌");
 }
}

/* START */
loadProducts();

</script>

</body>
</html>
